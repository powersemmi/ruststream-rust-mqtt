[package]
name = "ruststream-rust-mqtt-firmware-noalloc"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-rust-mqtt"
description = "A firmware binary for a Cortex-M that runs an MQTT subscriber on the embassy runtime over an embassy-net stack and defines no global allocator: it links only while the device variant and everything under it need no heap."
publish = false

# A workspace of its own: a member of the main workspace would unify `alloc` on through its
# neighbours, and its linker script and target would reach every workspace build.
[workspace]

[dependencies]
# The device variant: no `alloc` feature, so the broker keeps its buffers in the `static` the board
# declares.
ruststream-rust-mqtt = { path = "../../crates/ruststream-rust-mqtt", features = ["embassy"] }
ruststream = { version = ">=0.8.0-rc.1, <0.9.0", default-features = false, features = ["embassy", "macros"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-time-driver = "0.2.2"
systick-timer = { version = "0.2.3", features = ["embassy-time-driver"] }
embassy-net = { version = "0.9", features = ["tcp", "dns", "proto-ipv4", "medium-ip"] }
embassy-net-driver-channel = "0.4"
static_cell = "2"
heapless = { version = "0.9", default-features = false }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-halt = "1"

# The Cortex-M0+ has no compare-and-swap: `portable-atomic` (under `static_cell` and the framework)
# emulates it inside a critical section, which `cortex-m` provides for a single core.
[target.thumbv6m-none-eabi.dependencies]
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }
