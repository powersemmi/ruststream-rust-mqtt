[package]
name = "ruststream-rust-mqtt-firmware"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-rust-mqtt"
description = "A firmware binary for a Cortex-M4F that runs an MQTT subscriber on the embassy runtime, with a heap, over an embassy-net stack."
publish = false

# A workspace of its own: a member of the main workspace would reach its linker script and target
# into every workspace build.
[workspace]

[dependencies]
ruststream-rust-mqtt = { path = "../../crates/ruststream-rust-mqtt", features = ["embassy", "alloc"] }
ruststream = { version = ">=0.8.0-rc.1, <0.9.0", default-features = false, features = ["embassy", "macros"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-time-driver = "0.2.2"
systick-timer = { version = "0.2.3", features = ["embassy-time-driver"] }
embassy-net = { version = "0.9", features = ["tcp", "dns", "proto-ipv4", "medium-ip"] }
embassy-net-driver-channel = "0.4"
emballoc = "0.3"
static_cell = "2"
heapless = { version = "0.9", default-features = false }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-halt = "1"
