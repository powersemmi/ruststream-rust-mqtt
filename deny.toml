# cargo-deny configuration: the dependency-graph half of the security gate.
# Checks RustSec advisories, license compatibility, duplicate versions, and
# registry sources. Run locally with `just deny`.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Apache-2.0/MIT-compatible permissive licenses only.
allow = [
    "Apache-2.0",
    "MIT",
    # unicode-ident is (MIT OR Apache-2.0) AND Unicode-3.0; the Unicode license
    # only covers the embedded character tables and is permissive.
    "Unicode-3.0",
    # embassy-net's smoltcp and managed are 0BSD; compio's slotmap is Zlib; the allocation guard
    # of the core runtime (assert_no_alloc) is BSD-1-Clause. All OSI-approved and permissive.
    "0BSD",
    "Zlib",
    "BSD-1-Clause",
]

[bans]
# clippy::cargo's multiple_crate_versions is allowed in the workspace lints
# because client dependency trees pull unavoidable duplicates; warn (not deny)
# so the report stays visible without blocking on a transitive choice.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The unpublished test-suite crate of the core, a dev-dependency every broker repository takes
# from core main.
allow-git = ["https://github.com/powersemmi/ruststream"]
